id: polymark
filetype: polymark
detect:
    filename: "\\.(pm|md|txt)$"

rules:
    # Comments
    - comment:
        start: "///"
        end: "$"
        rules: []

    # Headings
    - heading: "^\\s*(#+)(\\s+)(.+)$"
    
    # Dates & Timestamps
    - date.header: "\\b\\d{4}-\\d{2}-\\d{2}\\b"
    - timestamp: "\\b\\d{4}-\\d{2}-\\d{2}-\\d{2}-\\d{2}-\\d{2}\\b"
    
    # Tasks
    - task.incomplete: "- \\[ \\]"
    - task.complete: "- \\[x\\]"
    
    # Areas & Projects
    - area.name: "@[^/\\n\\r]+"
    - project.name: "/@[^/\\n\\r]+"
    
    # Metadata
    - metadata.key: "\\[[^\\]]+\\]:"
    
    # Symbols & Separators
    - separator: "^---$"
    - tag: "<[a-z]+>"
    - status.alert: "\\[!\\]"
    - status.question: "\\[\\?\\]"
    
    # Basic styles
    - bold: "\\*\\*.*\\*\\*"
    - italic: "\\*.*\\*"
