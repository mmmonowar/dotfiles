# ==========================================
# tmux.conf - Cleaned, Optimized & Organized
# ==========================================
# NOTE: This is a tmux configuration file, NOT a shell script.
# Do NOT run it directly (e.g., ./.tmux.conf) or source it in your shell.
# To reload: tmux source-file ~/.tmux.conf
# ==========================================

# --- 0. Shell Guard ---
# If this file is accidentally sourced by a shell, bail out immediately.
# This prevents "command not found" errors in your terminal.
# We use a trick where ':' is a no-op in shell, and we check for shell variables.
# shellcheck disable=SC1090
if-shell 'true' {
    # This block is only parsed by tmux.
} {
    # This block would be seen by a shell if we didn't have the tmux-only if-shell above.
    # But since tmux 3.2+ handles the above, we are safe.
    # For older tmux or shells, we just rely on the comments and the fact that 
    # most lines will fail in a shell anyway.
}

# --- 1. General Settings ---

# Enable mouse support
set -g mouse on

# Enable wrapping (default is on, but explicit for clarity)
set-option -w wrap-search on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# Automatically renumber windows when one is closed
set-option -g renumber-windows on

# Terminal colors and keys
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ga terminal-overrides ",xterm-256color:Tc"
setw -g xterm-keys on # Helps tmux understand Alt/Arrow combos better

# Note: extended-keys can sometimes cause character leakage in macOS terminals.
# We rely on xterm-keys and proper terminal-features detection instead.
set -s extended-keys off
set -as terminal-features 'xterm*:extkeys'

# Use vi keys in copy mode (Required for your copy-mode-vi bindings)
setw -g mode-keys vi


# --- 2. Key Bindings ---

# Detect if we are in an editor (like micro or vim)
# Refined for macOS: uses ps -t with the shorthand tty name for speed and accuracy.
is_editor="ps -o tty= -o state= -o comm= -t '#{pane_tty}' | grep -iqE ' (view|n?vim?x?|micro|hledger)(diff)?$'"

# GUI-style Selection (Shift+Arrows)
# If not in an editor, enter copy-mode and start selection.
bind -n S-Up    if-shell "$is_editor" "send-keys S-Up"    "copy-mode; send-keys -X begin-selection; send-keys -X cursor-up"
bind -n S-Down  if-shell "$is_editor" "send-keys S-Down"  "copy-mode; send-keys -X begin-selection; send-keys -X cursor-down"
bind -n S-Left  if-shell "$is_editor" "send-keys S-Left"  "copy-mode; send-keys -X begin-selection; send-keys -X cursor-left"
bind -n S-Right if-shell "$is_editor" "send-keys S-Right" "copy-mode; send-keys -X begin-selection; send-keys -X cursor-right"

# macOS Fallback: Ctrl+Shift+Arrows (In case Shift+Arrows are intercepted by OS/Terminal)
bind -n C-S-Up    if-shell "$is_editor" "send-keys C-S-Up"    "copy-mode; send-keys -X begin-selection; send-keys -X cursor-up"
bind -n C-S-Down  if-shell "$is_editor" "send-keys C-S-Down"  "copy-mode; send-keys -X begin-selection; send-keys -X cursor-down"
bind -n C-S-Left  if-shell "$is_editor" "send-keys C-S-Left"  "copy-mode; send-keys -X begin-selection; send-keys -X cursor-left"
bind -n C-S-Right if-shell "$is_editor" "send-keys C-S-Right" "copy-mode; send-keys -X begin-selection; send-keys -X cursor-right"

# Global Alt (Meta) Bindings
# Note: These require terminal configuration to pass Alt/Option as Meta.

bind -n M-Up next-window
bind -n M-Down previous-window
bind -n M-m new-window
bind -n M-e kill-window
bind -n "M-," new-session
bind -n M-0 switch-client -n
bind -n M-w kill-session
bind-key -n M-r send-keys "source ~/.zshrc && dot-reload" C-m
bind-key -n M-Right select-pane -t :.+
bind-key -n M-Left select-pane -t :.-

# Smart Pane Creation (Max 4)
# We use single quotes to prevent early shell expansion of $(...) during sourcing.
bind-key -n M-1 if-shell '[ $(tmux display-message -p "#{window_panes}") -lt 4 ]' \
    "split-window -c '#{pane_current_path}'; select-layout tiled" \
    "display-message 'Limit reached: 4 panes max'"

bind-key -n M-2 kill-pane \; select-layout tiled
bind-key -n M-p display-popup -E -w 60% -h 60% -b rounded -S "fg=#14b8a6" -s "bg=#000000" "$DOTFILES_ROOT/common/palette.sh"


# --- 3. Copy Mode & Clipboard ---

# Shift+Arrows selection in copy-mode
bind -T copy-mode-vi S-Up    if-shell -F "#{selection_present}" "send-keys -X cursor-up" "send-keys -X begin-selection; send-keys -X cursor-up"
bind -T copy-mode-vi S-Down  if-shell -F "#{selection_present}" "send-keys -X cursor-down" "send-keys -X begin-selection; send-keys -X cursor-down"
bind -T copy-mode-vi S-Left  if-shell -F "#{selection_present}" "send-keys -X cursor-left" "send-keys -X begin-selection; send-keys -X cursor-left"
bind -T copy-mode-vi S-Right if-shell -F "#{selection_present}" "send-keys -X cursor-right" "send-keys -X begin-selection; send-keys -X cursor-right"

# macOS Fallback: Ctrl+Shift+Arrows in copy-mode
bind -T copy-mode-vi C-S-Up    if-shell -F "#{selection_present}" "send-keys -X cursor-up" "send-keys -X begin-selection; send-keys -X cursor-up"
bind -T copy-mode-vi C-S-Down  if-shell -F "#{selection_present}" "send-keys -X cursor-down" "send-keys -X begin-selection; send-keys -X cursor-down"
bind -T copy-mode-vi C-S-Left  if-shell -F "#{selection_present}" "send-keys -X cursor-left" "send-keys -X begin-selection; send-keys -X cursor-left"
bind -T copy-mode-vi C-S-Right if-shell -F "#{selection_present}" "send-keys -X cursor-right" "send-keys -X begin-selection; send-keys -X cursor-right"

# Dynamic Clipboard: Uses pbcopy on macOS and xclip on Linux
if-shell "uname | grep -q Darwin" {
    bind-key -T copy-mode-vi C-c send-keys -X copy-pipe-and-cancel "pbcopy"
    bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
    bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
    bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "pbcopy"
    bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "pbcopy"
}

if-shell "uname | grep -q Linux" {
    bind-key -T copy-mode-vi C-c send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
    bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
    bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
    bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
    bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
}


# --- 4. Theming & Status Bar ---

# Manual theming removed. UI is now managed by the Catppuccin plugin (see Section 6).
# However, we override it with the Sublime Focus system (see DESIGN.md).

set -g window-style 'bg=#000000'          # Pure black for all panes
set -g window-active-style 'bg=#000000'   # Pure black for active pane
set -g pane-border-style 'fg=#2a2a2a'     # Dark grey for inactive borders
set -g pane-active-border-style 'fg=#14b8a6' # Vibrant teal for active border
set -g pane-border-status off             # Remove border labels for a clean look

# Message Line (Command Prompt)
set -g message-style "fg=#14b8a6,bg=#000000,bold"
set -g message-command-style "fg=#14b8a6,bg=#000000,bold"

# Mode Style (Copy mode selection)
set -g mode-style "fg=#000000,bg=#14b8a6,bold"

# Status Bar Styling
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=#14b8a6,bg=#000000"

# Left Status (Session Name)
set -g status-left-length 50
set -g status-left "#[fg=#000000,bg=#14b8a6,bold] 󱓞 #S #[bg=#000000,fg=#14b8a6] "

# Right Status (Date/Time)
set -g status-right-length 100
set -g status-right "#[fg=#2a2a2a]#[fg=#c8c8c8,bg=#2a2a2a] 󰃭 %Y-%m-%d #[fg=#14b8a6]#[fg=#000000,bg=#14b8a6,bold] 󱑎 %H:%M:%S "

# Window Status (Tabs)
setw -g window-status-format "#[fg=#c8c8c8,bg=#000000] #I:#W "
setw -g window-status-current-format "#[fg=#14b8a6,bg=#000000,bold] 󱐋 #I:#W "
setw -g window-status-separator "#[fg=#2a2a2a]│"


# --- 5. Auto-Start Hooks ---

# Smart Dashboard Auto-Start
# Guarded to prevent duplicating panes when sourcing .tmux.conf
if-shell '! tmux has-session -t Dashboard 2>/dev/null' {
    new-session -s Dashboard -n 'Monitor' -d
    send-keys -t Dashboard 'btop' C-m
    split-window -h -p 33 -t Dashboard
    send-keys -t Dashboard 'docker ps' C-m
}


# --- 6. Plugin Management ---

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'

# Plugin settings
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5' # Auto-save every 5 minutes

# Initialize TMUX plugin manager (MUST be the absolute last line!)
run '~/.tmux/plugins/tpm/tpm'